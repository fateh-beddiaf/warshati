name: CI

# Light checks on every push and pull request to main. The end-to-end suite is slow on the hosted runner: it runs on
# releases (release.yml) and on demand (e2e.yml: Actions > E2E > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The unit tests run in Electron's bundled Node (scripts/run-tests.cjs), so npm ci still downloads Electron
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Lint, format, typecheck, UI rules, unit tests
        run: npm run verify
