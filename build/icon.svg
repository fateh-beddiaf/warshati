<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Warshati app icon: a phone and a wrench on the app's primary gradient (the primary and primary-to tokens of the light theme).
       Source for build/icon.png and build/icon.ico: run `npm run icons` after editing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2545e4" />
      <stop offset="1" stop-color="#603ee9" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" />
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)" />
  <!-- Phone -->
  <rect x="70" y="36" width="104" height="184" rx="22" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="12" />
  <line x1="108" y1="58" x2="136" y2="58" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  <!-- Wrench, drawn twice: a wide stroke in the background colour cuts it out of the phone, then the white wrench -->
  <g transform="translate(66 70) scale(6)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
      stroke="#4340e6"
      stroke-width="5.5"
    />
    <path
      d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="2.2"
    />
  </g>
</svg>
